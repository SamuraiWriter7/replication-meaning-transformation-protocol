
name: Validate RMTP v0.1

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rmtp-validation-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install validation dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "jsonschema>=4.18,<5"

      - name: Check validator syntax
        run: |
          set -euo pipefail
          python -m py_compile scripts/validate_examples.py

      - name: Validate RMTP schemas and examples
        run: |
          set -euo pipefail
          python scripts/validate_examples.py
